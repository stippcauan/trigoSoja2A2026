<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> loja virtual de produtos naturais e enlatados </title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="inicio">
    <header class="cabecalho">
        <div class="cabecalho-marca">
            <img src="produtos.png" alt="produtos.jpg" class="cabecalho-imagem">
        <div>
            <p class="cabecalho-subtitulo"> produtos </p>
            <h1 class="cabecalho-titulo"> loja virtual de produtos naturais e enlatados </h1>
            </div>
        </div>

        <nav>
            <ul class="cabecalho-lista">
                <li class="cabecalho-lista-item"> <a href="#natural">Natural</a></li>
                <li class="cabecalho-lista-item"> <a href="#enlatado">enlatado</a></li>
                <Li class="cabecalho-lista-item"> <a href="#contato">Contato</a></Li>
                
            </ul>
        </nav>
        <button class="botao-tema" id="botao-tema" type="button">
            🌙 tema
        </button>
    
    </header>
    <section class="fale-conosco" id="contato">
<h2>Contato</h2>
<p>Preencha os campos abaixo para entrar em contato.</p>

<form id="formulario-contato" action="https://formsubmit.co/ajax/vladismara@gmail.com&quot; method="post">
<input type="hidden" name="_subject" value="Nova mensagem do site Trigo e Soja">
<input type="hidden" name="_template" value="table">

<label for="nome">Nome:</label>
<input type="text" id="nome" name="Nome" placeholder="Digite seu nome completo" required>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" name="Telefone" placeholder="(99) 9 9 999-9999" maxlength="16" required>

<label for="email">E-mail:</label>
<input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

<label for="mensagem">Mensagem:</label>
<textarea id="mensagem" name="Mensagem" rows="6" placeholder="Escreva sua mensagem aqui!" required></textarea>

<button type="submit">Enviar</button>
</form>

<p id="resposta-formulario" class="aviso-formulario" aria-live="polite"></p>
</section>
</body>
</html>
