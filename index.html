<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de produtos Naturais e Enlatados </title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="inicio">
    <header class="cabecalho">
        <div class="cabecalho-marca">
            <img src="produtos.png" alt="produtos" class="cabecalho-imagem">
            <div>
                <p class="cabecalho-subtitulo"> Naturais & IElatados </p>
                <h1 class="cabecalho-titulo"> Loja de produtos Naturais e Enlatados</h1>
            </div>
        </div>
        <nav>
            <ul class="cabecalho-lista">
                <li class="cabecalho-lista-item"> <a href="#naturais"> Naturais </a> </li>
                <li class="cabecalho-lista-item"> <a href="#inlatados"> Enlatados </a></li>
                <li class="cabecalho-lista-item"> <a href="#contato"> 💌 Contato </a> </li>
            </ul>
        </nav>
        <button class="botao-tema" id="botao-tema" type="button">
            🌙 Tema
        </button>
    </header>


    <main>
        <section class="descricao" id="Naturais">
            <h2> naturais </h2>
        </section>

        <section class="secao">
            <div class="texto">
                <p>######
                </p>
                <p>#####
                </p>
            </div>

            <div class="imagem">
                <img src="####" alt="naturais">
                <img src="#####" alt="naturais">
            </div>
        </section>


        <section class="descricao" id="Enlatados">
            <h2> Inlatados </h2>
        </section>

        <section class="secao">
            <div class="texto">
                <p>####</p>

                <p>######</p>
            </div>

            <div class="imagem">
                <img src="comida-lata.jpg" alt="enlatados">
                <img src="enlatado.jpeg" alt="enlatados">
            </div>
        </section>


        <section class="fale-conosco" id="contato">
            <h2>Contato</h2>
            <p>Preencha os campos abaixo para entrar em contato.</p>

            <form id="formulario-contato" action="https://formsubmit.co/ajax/cauanst.com" method="post">
                <input type="hidden" name="_subject" value="Nova mensagem do site Naturais e Enlatados">
                <input type="hidden" name="_template" value="table">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="Nome" placeholder="Digite seu nome completo" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="Telefone" placeholder="(99) 9 9 999-9999" maxlength="16" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="Mensagem" rows="6" placeholder="Escreva sua mensagem aqui!"
                    required></textarea>

                <button type="submit">Enviar</button>
            </form>

            <p id="resposta-formulario" class="aviso-formulario" aria-live="polite"></p>
        </section>
    </main> 


    <footer id="fim">
        <div class="texto">
            <p>
                <strong> Desenvolvido por: </strong>
                <em> Cauan Stipp</em> <br>
                WhatsApp: (43) 9 7777-6666 | cauanst@gmail.com
            </p>
        </div>
    </footer>
   
    <a href="#inicio" class="voltar" aria-label="Voltar ao início"> # </a>

    <script src="script.js"></script>
</body>

</html>
